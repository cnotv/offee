# The only container that publishes a port. It forwards to the app and nowhere else, so the
# app's network stays internal.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;
  server_tokens off;

  server {
    listen 8470;
    client_max_body_size 200m;

    # Docker's resolver, asked again every few seconds, so a restarted app is found at its new
    # address instead of the one cached at startup.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app_upstream http://app:8470;

    location / {
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      # The app checks Host and Origin itself; pass the browser's unchanged.
      proxy_set_header Host $http_host;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
