name: Netlify
# One Netlify site holds the website at the root and the demo app under /demo/. A deploy replaces
# the whole site, so every deploy builds both, whichever workflow called it. Pull requests get a
# preview; main goes to production.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # When both callers run for one push, their deploys queue instead of racing.
    concurrency:
      group: netlify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'pull_request' && 'netlify-preview' || 'netlify' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # The Mac app's Electron is a dependency of the workspace, not of the UI.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # No Offee server runs on Netlify, so the UI is built in demo mode: sample data and canned
      # answers that live in the browser tab, so nothing typed there is sent.
      - run: pnpm --filter @offee/web build --base /demo/
        env:
          VITE_DEMO_MODE: '1'

      - name: Assemble the site
        run: |
          mkdir _netlify
          cp -R site/. _netlify/
          cp -R docs/media _netlify/media
          cp -R apps/web/dist _netlify/demo
          cp deploy/netlify/_headers deploy/netlify/_redirects _netlify/
          grep -q 'src="/demo/assets/' _netlify/demo/index.html

      - id: deploy
        name: Deploy
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PULL_REQUEST" ]; then
            target=(--alias "deploy-preview-$PULL_REQUEST")
            field=deploy_url
          else
            target=(--prod)
            field=url
          fi
          npx --yes netlify-cli@27.12.1 deploy --dir _netlify --site "$NETLIFY_SITE_ID" --no-build --json "${target[@]}" > deploy.json
          url="$(jq -r ".$field" deploy.json)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Website: $url/  Demo app: $url/demo/" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.deploy.outcome == 'skipped'
        run: echo "::notice::Netlify deploy skipped; set the NETLIFY_AUTH_TOKEN secret and the NETLIFY_SITE_ID variable to enable it."
