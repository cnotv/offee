name: Website
# The project site at https://cnotv.github.io/offee/: the static pages in site/ and the media the
# README shows too, published as they are, with no build step. A change here also redeploys
# Netlify, where the site sits next to the demo app.
on:
  pull_request:
    paths: &website-paths
      - site/**
      - docs/media/**
      - deploy/netlify/**
      - .github/workflows/website.yml
      - .github/workflows/netlify.yml
  push:
    branches: [main]
    paths: *website-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: cp -R site _site && cp -R docs/media _site/media
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  netlify:
    uses: ./.github/workflows/netlify.yml
    secrets: inherit
