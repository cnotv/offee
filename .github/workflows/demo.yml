name: Demo app
# The UI in demo mode on Netlify. Only Netlify: the demo has no place on GitHub Pages.
on:
  pull_request:
    paths: &demo-paths
      - apps/web/**
      - packages/contracts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - deploy/netlify/**
      - .github/workflows/demo.yml
      - .github/workflows/netlify.yml
  push:
    branches: [main]
    paths: *demo-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netlify:
    uses: ./.github/workflows/netlify.yml
    secrets: inherit
