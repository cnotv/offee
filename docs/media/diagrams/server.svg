<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="The team's laptops open Offee in a browser and reach the server only through a private network: Tailscale over HTTPS for your own devices, or an SSH tunnel. On the server, Offee runs in a Linux VM and answers only on the server's own 127.0.0.1; profiles, documents, the run log, the switch and the API key all stay there. There are no user accounts, so everyone with access sees everything. The internet has no way in: no port is open for Offee and Tailscale Funnel is refused.">
  <style>
    svg { --paper: #f6f7f4; --zone: #eceff3; --card: #ffffff; --ink: #1a2438; --muted: #566173; --line: #b9c1cc; --green: #2e7a50; --green-soft: #e1f0e6; --amber: #a86a12; --amber-soft: #f7ecd6; --red: #ae4430; --red-soft: #f6e1dc; --blue: #24508f; --blue-soft: #e2eaf6; }
    @media (prefers-color-scheme: dark) {
      svg { --paper: #12171f; --zone: #19202b; --card: #212a37; --ink: #e6e9ee; --muted: #a3acba; --line: #46515f; --green: #5fbf88; --green-soft: #1b3326; --amber: #e0a548; --amber-soft: #382c17; --red: #ec7d63; --red-soft: #3b221c; --blue: #8cb4ee; --blue-soft: #1c2940; }
    }
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: var(--ink); }
    .title { font-size: 17px; font-weight: 650; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 12.5px; fill: var(--muted); }
    .small { font-size: 12px; font-weight: 600; }
    .paper { fill: var(--paper); }
    .zone { fill: var(--zone); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
    .chip { fill: var(--blue-soft); }
    .chip-text { fill: var(--blue); }
    .flow { stroke: var(--ink); stroke-width: 1.6; fill: none; }
    .blocked { stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .arrowhead { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
  </defs>
  <rect class="paper" width="960" height="440" rx="20"/>

  <!-- The team -->
  <rect class="zone" x="16" y="16" width="260" height="408" rx="18"/>
  <rect x="34" y="32" width="26" height="17" rx="3" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
  <path d="M29 53 H65" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
  <text class="title" x="74" y="48">Your team</text>

  <rect class="card" x="34" y="72" width="224" height="70" rx="12"/>
  <text class="label" x="50" y="100">Your laptop</text>
  <text class="note" x="50" y="122">a browser is all it needs</text>

  <rect class="card" x="34" y="160" width="224" height="70" rx="12"/>
  <text class="label" x="50" y="188">A colleague's laptop</text>
  <text class="note" x="50" y="210">same Offee, same documents</text>

  <rect class="card" x="34" y="248" width="224" height="70" rx="12"/>
  <text class="label" x="50" y="276">Any of your devices</text>
  <text class="note" x="50" y="298">on the private network</text>

  <rect x="34" y="340" width="224" height="68" rx="12" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="1.2"/>
  <text class="label" x="50" y="367">No user accounts</text>
  <text class="note" x="50" y="389">everyone with access sees all</text>

  <!-- The private network -->
  <path class="flow" d="M258 107 C280 107 278 206 296 206" marker-end="url(#arrow)"/>
  <path class="flow" d="M258 195 C278 195 278 228 296 228" marker-end="url(#arrow)"/>
  <path class="flow" d="M258 283 C280 283 278 250 296 250" marker-end="url(#arrow)"/>
  <rect x="298" y="170" width="242" height="116" rx="14" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1.4"/>
  <text class="label" x="314" y="200">Private network</text>
  <text class="note" x="314" y="224">Tailscale: HTTPS, your devices only</text>
  <text class="note" x="314" y="244">or an SSH tunnel</text>
  <text class="small" x="314" y="270" fill="var(--green)">the only way in</text>

  <!-- The server -->
  <rect class="zone" x="560" y="16" width="384" height="408" rx="18"/>
  <rect x="578" y="29" width="24" height="10" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
  <rect x="578" y="43" width="24" height="10" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
  <text class="title" x="614" y="48">Your server</text>

  <path class="flow" d="M540 228 C562 228 560 160 578 160" marker-end="url(#arrow)"/>
  <rect class="card" x="580" y="72" width="344" height="180" rx="12"/>
  <text class="label" x="596" y="100">Offee, in a Linux VM</text>
  <text class="note" x="596" y="122">answers only on the server's 127.0.0.1</text>
  <rect class="chip" x="596" y="138" width="92" height="28" rx="14"/>
  <text class="small chip-text" x="642" y="156" text-anchor="middle">Profiles</text>
  <rect class="chip" x="696" y="138" width="104" height="28" rx="14"/>
  <text class="small chip-text" x="748" y="156" text-anchor="middle">Documents</text>
  <rect class="chip" x="808" y="138" width="100" height="28" rx="14"/>
  <text class="small chip-text" x="858" y="156" text-anchor="middle">Run log</text>
  <rect class="chip" x="596" y="174" width="112" height="28" rx="14"/>
  <text class="small chip-text" x="652" y="192" text-anchor="middle">The switch</text>
  <rect class="chip" x="716" y="174" width="96" height="28" rx="14"/>
  <text class="small chip-text" x="764" y="192" text-anchor="middle">API key</text>
  <text class="note" x="596" y="232">all of it stays here, under the server's disk encryption</text>

  <!-- The internet, kept out -->
  <path class="blocked" d="M752 252 V330"/>
  <path d="M743 282 L761 300 M761 282 L743 300" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="580" y="332" width="344" height="76" rx="12" fill="var(--red-soft)" stroke="var(--red)" stroke-width="1.2"/>
  <text class="label" x="596" y="360">The internet</text>
  <text class="note" x="596" y="382">no port open for Offee; Tailscale Funnel is refused</text>
</svg>
