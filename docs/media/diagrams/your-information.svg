<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="Files enter Offee only when you upload them in its window: forms, scans and photos, emails, recordings. The app keeps everything in one database inside the VM: profiles, personas, documents with their searchable text, files, and the run log. What it produces leaves only when you download it: filled and signed PDFs and Word files. It never reads or writes a folder on your Mac.">
  <style>
    svg { --paper: #f6f7f4; --zone: #eceff3; --card: #ffffff; --ink: #1a2438; --muted: #566173; --line: #b9c1cc; --green: #2e7a50; --green-soft: #e1f0e6; --amber: #a86a12; --amber-soft: #f7ecd6; --red: #ae4430; --red-soft: #f6e1dc; --blue: #24508f; --blue-soft: #e2eaf6; }
    @media (prefers-color-scheme: dark) {
      svg { --paper: #12171f; --zone: #19202b; --card: #212a37; --ink: #e6e9ee; --muted: #a3acba; --line: #46515f; --green: #5fbf88; --green-soft: #1b3326; --amber: #e0a548; --amber-soft: #382c17; --red: #ec7d63; --red-soft: #3b221c; --blue: #8cb4ee; --blue-soft: #1c2940; }
    }
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: var(--ink); }
    .title { font-size: 17px; font-weight: 650; }
    .label { font-size: 15px; font-weight: 600; }
    .note { font-size: 12.5px; fill: var(--muted); }
    .small { font-size: 12px; font-weight: 600; }
    .paper { fill: var(--paper); }
    .zone { fill: var(--zone); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
    .flow { stroke: var(--ink); stroke-width: 1.6; fill: none; }
    .blocked { stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .arrowhead { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
  </defs>
  <rect class="paper" width="960" height="480" rx="20"/>

  <!-- In -->
  <text class="title" x="32" y="48">You upload</text>
  <rect class="card" x="32" y="66" width="168" height="40" rx="10"/><text class="label" x="48" y="91">PDF form</text>
  <rect class="card" x="32" y="114" width="168" height="40" rx="10"/><text class="label" x="48" y="139">Scan or photo</text>
  <rect class="card" x="32" y="162" width="168" height="40" rx="10"/><text class="label" x="48" y="187">Email or chat</text>
  <rect class="card" x="32" y="210" width="168" height="40" rx="10"/><text class="label" x="48" y="235">Recording</text>

  <!-- The app -->
  <path class="flow" d="M200 158 H372" marker-end="url(#arrow)"/>
  <text class="note" x="224" y="148">upload in the window</text>
  <rect x="374" y="110" width="212" height="96" rx="14" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="1.4"/>
  <text class="label" x="394" y="140">app, inside the VM</text>
  <text class="note" x="394" y="162">reads the text (OCR for scans),</text>
  <text class="note" x="394" y="180">asks the local model</text>

  <!-- Out -->
  <path class="flow" d="M586 158 H758" marker-end="url(#arrow)"/>
  <text class="note" x="606" y="148">download in the window</text>
  <text class="title" x="760" y="48">You download</text>
  <rect class="card" x="760" y="90" width="168" height="40" rx="10"/><text class="label" x="776" y="115">Filled PDF</text>
  <rect class="card" x="760" y="138" width="168" height="40" rx="10"/><text class="label" x="776" y="163">Signed PDF</text>
  <rect class="card" x="760" y="186" width="168" height="40" rx="10"/><text class="label" x="776" y="211">Word file</text>

  <!-- The database -->
  <path class="flow" d="M480 206 V262" marker-end="url(#arrow)"/>
  <text class="note" x="490" y="240">keeps and searches</text>
  <path d="M114 284 a366 22 0 0 1 732 0 V418 a366 22 0 0 1 -732 0 Z" fill="var(--zone)" stroke="var(--line)" stroke-width="1.4"/>
  <ellipse cx="480" cy="284" rx="366" ry="22" fill="var(--card)" stroke="var(--line)" stroke-width="1.4"/>
  <text class="label" x="480" y="290" text-anchor="middle">offee.sqlite: one file holds all of it</text>

  <rect class="card" x="134" y="320" width="132" height="78" rx="10"/>
  <text class="label" x="148" y="345">Profiles</text>
  <text class="note" x="148" y="366">names, addresses,</text>
  <text class="note" x="148" y="382">signature, key</text>

  <rect class="card" x="274" y="320" width="132" height="78" rx="10"/>
  <text class="label" x="288" y="345">Personas</text>
  <text class="note" x="288" y="366">instructions,</text>
  <text class="note" x="288" y="382">model choice</text>

  <rect class="card" x="414" y="320" width="132" height="78" rx="10"/>
  <text class="label" x="428" y="345">Documents</text>
  <text class="note" x="428" y="366">their text, ready</text>
  <text class="note" x="428" y="382">to search</text>

  <rect class="card" x="554" y="320" width="132" height="78" rx="10"/>
  <text class="label" x="568" y="345">Files</text>
  <text class="note" x="568" y="366">forms, PDFs and</text>
  <text class="note" x="568" y="382">Word files made</text>

  <rect class="card" x="694" y="320" width="132" height="78" rx="10"/>
  <text class="label" x="708" y="345">Run log</text>
  <text class="note" x="708" y="366">every task, and</text>
  <text class="note" x="708" y="382">what left the Mac</text>

  <!-- Never -->
  <circle cx="44" cy="448" r="10" fill="var(--red-soft)" stroke="var(--red)"/>
  <path d="M39 443 L49 453 M49 443 L39 453" stroke="var(--red)" stroke-width="2"/>
  <text class="note" x="62" y="453" style="fill: var(--red)">Never: opens, scans or saves into a folder on your Mac</text>
</svg>
